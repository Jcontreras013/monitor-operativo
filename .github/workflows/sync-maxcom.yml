name: Sincronizar con cablecolor/MAXCOM

# Deja cablecolor/MAXCOM IDÉNTICO a este repositorio: sobrescribe su rama main
# con la de aquí, descartando el código anterior. Corre solo en cada merge a
# main, y también a mano desde la pestaña Actions.
#
# Requiere el secreto MAXCOM_SYNC_TOKEN: un token con permiso de ESCRITURA
# sobre cablecolor/MAXCOM. Se crea en este repositorio, en
# Settings -> Secrets and variables -> Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dos sincronizaciones a la vez podrían dejar MAXCOM con la versión más
# vieja de las dos. Se encolan y la última en entrar es la que manda.
concurrency:
  group: sync-maxcom
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    # Este archivo también se copia a MAXCOM al sincronizar. Sin esta guarda,
    # allá se dispararía solo e intentaría sobrescribirse a sí mismo.
    if: github.repository == 'Jcontreras013/monitor-operativo'

    steps:
      - name: Descargar el historial completo
        uses: actions/checkout@v4
        with:
          # Sin el historial completo el push se rechaza por shallow.
          fetch-depth: 0

      - name: Sobrescribir cablecolor/MAXCOM
        env:
          TOKEN: ${{ secrets.MAXCOM_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::Falta el secreto MAXCOM_SYNC_TOKEN. Créalo en Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # La URL lleva el token, así que NO se guarda como remoto con nombre
          # ni se imprime: se usa dentro del paso y no queda escrita en disco.
          DESTINO="https://x-access-token:${TOKEN}@github.com/cablecolor/MAXCOM.git"

          # --- Respaldo de un nivel -------------------------------------
          # Antes de borrar, se conserva lo que MAXCOM tenía en main dentro de
          # la rama 'respaldo-antes-de-sync'. Se reemplaza en cada corrida, así
          # que guarda SIEMPRE la versión inmediatamente anterior y no se
          # acumulan ramas. Es la red para el caso de que alguien haya editado
          # algo directo en MAXCOM sin avisar.
          # El '+' del refspec permite traer main aunque haya sido reescrito en
          # una sincronización anterior. En Actions cada corrida arranca limpia,
          # pero sin el '+' esto falla si el ref ya existe localmente.
          if git fetch "$DESTINO" +main:refs/remotes/maxcom/main 2>/dev/null; then
            echo "Guardando el estado actual de MAXCOM en 'respaldo-antes-de-sync'..."
            git push --force "$DESTINO" refs/remotes/maxcom/main:refs/heads/respaldo-antes-de-sync
            echo "Respaldo listo."
          else
            echo "MAXCOM no tiene rama main todavía (repo vacío o recién creado): no hay nada que respaldar."
          fi

          # --- Sobrescritura --------------------------------------------
          # --force porque los dos repos pueden no compartir historial: es
          # justamente lo pedido, que el código viejo de MAXCOM se descarte.
          echo "Sobrescribiendo main de MAXCOM con el código de este repositorio..."
          git push --force "$DESTINO" HEAD:main

          echo "✅ cablecolor/MAXCOM quedó idéntico a Jcontreras013/monitor-operativo."
          echo "   El código anterior de MAXCOM quedó en la rama 'respaldo-antes-de-sync'."
